services:
  frontend-webhook:
    image: void-webhook-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build
    volumes:
      - frontend_dist:/frontend_dist
    command:
      - sh
      - -c
      - rm -rf /frontend_dist/* && cp -r /app/dist/. /frontend_dist/ && echo done
    networks:
      - app

  backend-webhook:
    image: void-webhook-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 180m
    memswap_limit: 360m
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/void_webhook?schema=public
      - REDIS_URL=redis://redis:6379
      - NODE_OPTIONS=--max-old-space-size=150
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '8080'
    networks:
      - app
    dns:
      - 8.8.8.8
      - 1.1.1.1

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 24m
    memswap_limit: 48m
    depends_on:
      - backend-webhook
      - frontend-webhook
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/webhooks.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - frontend_dist:/var/www/frontend:ro
    networks:
      - app

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 96m
    memswap_limit: 256m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: void_webhook
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d void_webhook']
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 45s
    networks:
      - app

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 24m
    memswap_limit: 48m
    command: redis-server --maxmemory 8mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - app

volumes:
  frontend_dist:
  postgres_data:

networks:
  app:
    driver: bridge
